<!doctype html>
<html lang="id">
<head>
<script>if(location.hostname==='sedakagede-oss.github.io'){var p=location.pathname.replace(/^\/DEVAN-TOUR\/?/,'/').replace(/^\/devan-bali-tour\/?/,'/');location.replace('https://devan-tour.pages.dev'+p+location.search+location.hash)}</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Harga — DEVAN TOUR</title>
<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#f5f8fc;color:#1d2733}
header{background:#1a73c8;color:#fff;padding:1rem}header .w{display:flex;align-items:center;gap:.8rem}header img{width:48px;height:48px;border-radius:50%;background:#fff}
.w{max-width:860px;margin:0 auto;padding:0 1rem}h1{font-size:1.2rem;margin:0}h2{font-size:1.05rem;margin:0 0 .8rem}
.box{background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(20,40,70,.08);padding:1.3rem;margin:1.2rem 0}
label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .25rem}input[type=text],input[type=password]{width:100%;padding:.65rem .8rem;border:1px solid #cfd8e3;border-radius:8px;font:inherit;font-size:1rem}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.hint{font-size:.8rem;color:#5d6b7a;margin:.2rem 0 0}
.tg{display:flex;align-items:center;gap:.5rem;font-weight:600;margin-top:.8rem}.tg input{width:20px;height:20px}
button{font:600 1rem Poppins,sans-serif;border:0;border-radius:8px;padding:.75rem 1.4rem;cursor:pointer;background:#f29f3d;color:#fff}button.sec{background:#e3e9f0;color:#1d2733}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e3e9f0;padding:.8rem 0}.bar .w{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
#msg{font-weight:600}.ok{color:#14874f}.err{color:#c62828}.pv{font-size:.85rem;color:#1a73c8;margin-top:.4rem}
@media(max-width:600px){.g{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="w"><img src="../images/logo-round-sm.png" alt=""><div><h1>Admin Harga Paket — DEVAN TOUR</h1><div style="font-size:.8rem;opacity:.9">Ubah harga tur, lalu tekan Simpan. Website diperbarui ±1 menit kemudian.</div></div></div></header>
<main class="w">
<section class="box" id="login">
<h2>1. Masuk</h2>
<label for="tok">Token GitHub (fine-grained)</label>
<input type="password" id="tok" autocomplete="off" placeholder="github_pat_...">
<p class="hint">Token hanya disimpan di browser komputer ini, tidak dikirim ke mana pun selain GitHub. Cara membuat token: lihat panduan.</p>
<label class="tg"><input type="checkbox" id="remember"> Ingat token di komputer ini</label>
<p style="margin-top:1rem"><button id="go">Masuk</button> <button class="sec" id="out" hidden>Keluar</button></p>
<p id="lmsg" class="hint"></p>
</section>
<form id="form" hidden></form>
</main>
<div class="bar" id="bar" hidden><div class="w"><button id="save">💾 Simpan Harga</button><a href="../" target="_blank">Lihat website ↗</a><span id="msg"></span></div></div>
<script>
const REPO='sedakagede-oss/DEVAN-TOUR',PATH='data/harga.json',API='https://api.github.com/repos/'+REPO+'/contents/'+PATH;
const NAMES={'kintamani':'Tur Kintamani','ubud':'Tur Ubud','uluwatu':'Tur Uluwatu & Kecak','nusa-penida':'Tur Nusa Penida Barat','tanah-lot':'Tur Tanah Lot','bedugul':'Tur Bedugul'};
let sha=null,data=null;const $=id=>document.getElementById(id);
const getTok=()=>sessionStorage.getItem('dbt-admin-token')||localStorage.getItem('dbt-admin-token')||'';
function hdr(){return{'Authorization':'Bearer '+getTok(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const b64e=s=>{const b=new TextEncoder().encode(s);let r='';b.forEach(c=>r+=String.fromCharCode(c));return btoa(r)};
const digits=v=>String(v||'').replace(/[^\d]/g,'');
const fmt=v=>digits(v)?'Rp '+parseInt(digits(v),10).toLocaleString('id-ID'):'';
async function load(){
  $('lmsg').textContent='Memuat…';
  const r=await fetch(API+'?ref=main&t='+Date.now(),{headers:hdr(),cache:'no-store'});
  if(r.status===401||r.status===403){$('lmsg').innerHTML='<span class="err">Token salah, kedaluwarsa, atau tidak punya izin. Cek panduan.</span>';return false}
  if(!r.ok){$('lmsg').innerHTML='<span class="err">Gagal memuat ('+r.status+').</span>';return false}
  const j=await r.json();sha=j.sha;data=JSON.parse(b64d(j.content));build();
  $('lmsg').innerHTML='<span class="ok">✓ Berhasil masuk.</span>';$('out').hidden=false;$('go').hidden=true;$('tok').closest('section').querySelectorAll('input').forEach(i=>i.disabled=true);return true}
function build(){
  const f=$('form');f.innerHTML='';
  for(const k in NAMES){const p=data.paket[k]||(data.paket[k]={idr:'',usd:'',catatan:'',catatan_en:'',aktif:false});
    const s=document.createElement('section');s.className='box';s.dataset.k=k;
    s.innerHTML=`<h2>${NAMES[k]}</h2><div class="g">
<div><label>Harga per orang (Rupiah)</label><input type="text" inputmode="numeric" name="idr" placeholder="contoh: 750000"><div class="pv"></div></div>
<div><label>Harga per orang (US$) — boleh kosong</label><input type="text" inputmode="numeric" name="usd" placeholder="contoh: 50"></div>
<div><label>Catatan (Indonesia) — boleh kosong</label><input type="text" name="catatan" placeholder="contoh: min. 2 orang"></div>
<div><label>Catatan (Inggris) — boleh kosong</label><input type="text" name="catatan_en" placeholder="example: min. 2 people"></div></div>
<label class="tg"><input type="checkbox" name="aktif"> Tampilkan harga ini di website</label>
<p class="hint">Jika harga kosong atau kotak ini tidak dicentang, website menampilkan “Harga segera hadir”.</p>`;
    for(const n of ['idr','usd','catatan','catatan_en'])s.querySelector(`[name=${n}]`).value=p[n]||'';
    s.querySelector('[name=aktif]').checked=!!p.aktif;
    const pv=()=>s.querySelector('.pv').textContent=fmt(s.querySelector('[name=idr]').value);s.querySelector('[name=idr]').oninput=pv;pv();
    f.appendChild(s)}
  f.hidden=false;$('bar').hidden=false}
$('go').onclick=async()=>{const t=$('tok').value.trim();if(!t){$('lmsg').textContent='Isi token dulu.';return}
  sessionStorage.setItem('dbt-admin-token',t);if($('remember').checked)localStorage.setItem('dbt-admin-token',t);
  if(!await load()){sessionStorage.removeItem('dbt-admin-token');localStorage.removeItem('dbt-admin-token')}};
$('out').onclick=()=>{sessionStorage.removeItem('dbt-admin-token');localStorage.removeItem('dbt-admin-token');location.reload()};
$('save').onclick=async()=>{
  const m=$('msg');m.className='';m.textContent='Menyimpan…';
  document.querySelectorAll('#form section').forEach(s=>{const p=data.paket[s.dataset.k];
    p.idr=digits(s.querySelector('[name=idr]').value);p.usd=digits(s.querySelector('[name=usd]').value);
    p.catatan=s.querySelector('[name=catatan]').value.trim();p.catatan_en=s.querySelector('[name=catatan_en]').value.trim();p.aktif=s.querySelector('[name=aktif]').checked});
  const r=await fetch(API,{method:'PUT',headers:hdr(),body:JSON.stringify({message:'Update harga paket (admin)',content:b64e(JSON.stringify(data,null,2)+'\n'),sha,branch:'main'})});
  if(r.ok){sha=(await r.json()).content.sha;m.className='ok';m.textContent='✓ Tersimpan! Website berubah dalam ±1 menit.'}
  else if(r.status===409){m.className='err';m.textContent='Data berubah di tempat lain. Muat ulang halaman lalu coba lagi.'}
  else{m.className='err';m.textContent='Gagal menyimpan ('+r.status+'). Cek token/izin.'}};
if(getTok()){$('tok').value='••••••••';load()}
</script>
</body>
</html>
