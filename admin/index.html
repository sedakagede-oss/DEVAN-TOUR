<!doctype html>
<html lang="id">
<head>
<script>if(location.hostname==='sedakagede-oss.github.io'){var p=location.pathname.replace(/^\/DEVAN-TOUR\/?/,'/').replace(/^\/devan-bali-tour\/?/,'/');location.replace('https://devan-tour.pages.dev'+p+location.search+location.hash)}</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Harga — DEVAN TOUR</title>
<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#f5f8fc;color:#1d2733}
header{background:#1a73c8;color:#fff;padding:1rem}header .w{display:flex;align-items:center;gap:.8rem}header img{width:48px;height:48px;border-radius:50%;background:#fff}
.w{max-width:860px;margin:0 auto;padding:0 1rem}h1{font-size:1.2rem;margin:0}h2{font-size:1.05rem;margin:0 0 .8rem}
.box{background:#fff;border-radius:10px;box-shadow:0 4px 18px rgba(20,40,70,.08);padding:1.3rem;margin:1.2rem 0}
label{display:block;font-size:.85rem;font-weight:600;margin:.6rem 0 .25rem}input[type=text],input[type=password]{width:100%;padding:.65rem .8rem;border:1px solid #cfd8e3;border-radius:8px;font:inherit;font-size:1rem}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}.hint{font-size:.8rem;color:#5d6b7a;margin:.2rem 0 0}
.tg{display:flex;align-items:center;gap:.5rem;font-weight:600;margin-top:.8rem}.tg input{width:20px;height:20px}
button{font:600 1rem Poppins,sans-serif;border:0;border-radius:8px;padding:.75rem 1.4rem;cursor:pointer;background:#f29f3d;color:#fff}button.sec{background:#e3e9f0;color:#1d2733}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e3e9f0;padding:.8rem 0}.bar .w{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
#msg{font-weight:600}.ok{color:#14874f}.err{color:#c62828}.pv{font-size:.85rem;color:#1a73c8;margin-top:.4rem}
@media(max-width:600px){.g{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="w"><img src="../images/logo-round-sm.png" alt=""><div><h1>Admin Harga Paket — DEVAN TOUR</h1><div style="font-size:.8rem;opacity:.9">Ubah harga tur, lalu tekan Simpan. Perubahan langsung tampil di website.</div></div></div></header>
<main class="w">
<section class="box" id="login">
<h2 id="ltitle">Masuk</h2>
<label for="pw" id="plabel">Kata sandi</label>
<input type="password" id="pw" autocomplete="current-password" placeholder="Kata sandi admin">
<p class="hint" id="phint">Kata sandi hanya untuk kamu. Tidak perlu token GitHub.</p>
<label class="tg" id="remember-row"><input type="checkbox" id="remember"> Ingat di komputer ini</label>
<p style="margin-top:1rem"><button id="go">Masuk</button> <button class="sec" id="out" hidden>Keluar</button></p>
<p id="lmsg" class="hint"></p>
</section>
<form id="form" hidden></form>
</main>
<div class="bar" id="bar" hidden><div class="w"><button id="save">Simpan Harga</button><a href="../" target="_blank">Lihat website ↗</a><span id="msg"></span></div></div>
<script>
const NAMES={'kintamani':'Tur Kintamani','ubud':'Tur Ubud','uluwatu':'Tur Uluwatu & Kecak','nusa-penida':'Tur Nusa Penida Barat','tanah-lot':'Tur Tanah Lot','bedugul':'Tur Bedugul'};
let data=null,setupNeeded=false;
const $=id=>document.getElementById(id);
const getPw=()=>sessionStorage.getItem('dbt-admin-pw')||localStorage.getItem('dbt-admin-pw')||'';
const setPw=(p,remember)=>{sessionStorage.setItem('dbt-admin-pw',p);if(remember)localStorage.setItem('dbt-admin-pw',p)};
const clearPw=()=>{sessionStorage.removeItem('dbt-admin-pw');localStorage.removeItem('dbt-admin-pw')};
const digits=v=>String(v||'').replace(/[^\d]/g,'');
const fmt=v=>digits(v)?'Rp '+parseInt(digits(v),10).toLocaleString('id-ID'):'';
function authHeaders(){return {'content-type':'application/json','x-admin-password':getPw()}}
function showSetup(on){
  setupNeeded=on;
  $('ltitle').textContent=on?'Buat kata sandi admin':'Masuk';
  $('plabel').textContent=on?'Buat kata sandi (minimal 8 karakter)':'Kata sandi';
  $('pw').placeholder=on?'Buat kata sandi baru':'Kata sandi admin';
  $('pw').autocomplete=on?'new-password':'current-password';
  $('phint').textContent=on?'Pilih kata sandi yang mudah kamu ingat. Ini hanya perlu sekali, lalu kamu masuk dengan kata sandi itu.':'Kata sandi hanya untuk kamu. Tidak perlu token GitHub.';
  $('go').textContent=on?'Simpan kata sandi':'Masuk';
}
async function status(){
  const r=await fetch('/api/admin/status?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('status');
  return r.json();
}
async function load(){
  $('lmsg').textContent='Memuat…';
  const r=await fetch('/api/harga?t='+Date.now(),{headers:authHeaders(),cache:'no-store'});
  if(r.status===401){$('lmsg').innerHTML='<span class="err">Kata sandi salah.</span>';return false}
  if(!r.ok){$('lmsg').innerHTML='<span class="err">Gagal memuat harga ('+r.status+').</span>';return false}
  data=await r.json();build();
  $('lmsg').innerHTML='<span class="ok">Berhasil masuk.</span>';$('out').hidden=false;$('go').hidden=true;$('pw').disabled=true;$('remember').disabled=true;return true
}
function build(){
  const f=$('form');f.innerHTML='';
  for(const k in NAMES){const p=data.paket[k]||(data.paket[k]={idr:'',idr_half:'',usd:'',catatan:'',catatan_en:'',aktif:false});
    const s=document.createElement('section');s.className='box';s.dataset.k=k;
    s.innerHTML=`<h2>${NAMES[k]}</h2><div class="g">
<div><label>Harga full day (Rupiah)</label><input type="text" inputmode="numeric" name="idr" placeholder="contoh: 700000"><div class="pv" data-for="idr"></div></div>
<div><label>Harga half day (Rupiah) — boleh kosong</label><input type="text" inputmode="numeric" name="idr_half" placeholder="contoh: 500000"><div class="pv" data-for="idr_half"></div></div>
<div><label>Harga (US$) — boleh kosong</label><input type="text" inputmode="numeric" name="usd" placeholder="contoh: 50"></div>
<div><label>Catatan (Indonesia) — boleh kosong</label><input type="text" name="catatan" placeholder="contoh: min. 2 orang"></div>
<div><label>Catatan (Inggris) — boleh kosong</label><input type="text" name="catatan_en" placeholder="example: min. 2 people"></div></div>
<label class="tg"><input type="checkbox" name="aktif"> Tampilkan harga ini di website</label>
<p class="hint">Jika harga kosong atau kotak ini tidak dicentang, website menampilkan “Harga segera hadir”.</p>`;
    for(const n of ['idr','idr_half','usd','catatan','catatan_en'])s.querySelector('[name='+n+']').value=p[n]||'';
    s.querySelector('[name=aktif]').checked=!!p.aktif;
    const paint=()=>{s.querySelector('[data-for=idr]').textContent=fmt(s.querySelector('[name=idr]').value);s.querySelector('[data-for=idr_half]').textContent=fmt(s.querySelector('[name=idr_half]').value)};
    s.querySelector('[name=idr]').oninput=paint;s.querySelector('[name=idr_half]').oninput=paint;paint();
    f.appendChild(s)}
  f.hidden=false;$('bar').hidden=false}
$('go').onclick=async()=>{
  const t=$('pw').value.trim();
  $('lmsg').textContent='';
  if(setupNeeded){
    if(t.length<8){$('lmsg').innerHTML='<span class="err">Kata sandi minimal 8 karakter.</span>';return}
    const r=await fetch('/api/admin/setup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:t})});
    if(r.status===409){$('lmsg').innerHTML='<span class="err">Kata sandi sudah dibuat. Masuk dengan kata sandi yang ada.</span>';showSetup(false);return}
    if(!r.ok){$('lmsg').innerHTML='<span class="err">Gagal menyimpan kata sandi.</span>';return}
    setPw(t,$('remember').checked);showSetup(false);await load();return;
  }
  if(!t){$('lmsg').textContent='Isi kata sandi dulu.';return}
  setPw(t,$('remember').checked);
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:t})});
  if(!r.ok){clearPw();$('lmsg').innerHTML='<span class="err">Kata sandi salah.</span>';return}
  if(!await load())clearPw();
};
$('out').onclick=()=>{clearPw();location.reload()};
$('save').onclick=async()=>{
  const m=$('msg');m.className='';m.textContent='Menyimpan…';
  document.querySelectorAll('#form section').forEach(s=>{const p=data.paket[s.dataset.k];
    p.idr=digits(s.querySelector('[name=idr]').value);
    p.idr_half=digits(s.querySelector('[name=idr_half]').value);
    p.usd=digits(s.querySelector('[name=usd]').value);
    p.catatan=s.querySelector('[name=catatan]').value.trim();
    p.catatan_en=s.querySelector('[name=catatan_en]').value.trim();
    p.aktif=s.querySelector('[name=aktif]').checked});
  const r=await fetch('/api/harga',{method:'POST',headers:authHeaders(),body:JSON.stringify(data)});
  if(r.ok){m.className='ok';m.textContent='Tersimpan! Harga sudah tampil di website.'}
  else if(r.status===401){m.className='err';m.textContent='Sesi habis. Masuk lagi, lalu simpan.'}
  else{m.className='err';m.textContent='Gagal menyimpan ('+r.status+').'}
};
(async()=>{
  try{
    const st=await status();
    showSetup(!!st.setupNeeded);
    if(!st.setupNeeded && getPw()){$('pw').value='••••••••';const ok=await load();if(!ok)$('pw').value=''}
  }catch(e){$('lmsg').innerHTML='<span class="err">Tidak bisa menghubungi admin. Pastikan kamu membuka situs Cloudflare.</span>'}
})();
</script>
</body>
</html>
